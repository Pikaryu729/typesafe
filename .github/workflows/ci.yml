name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by deploy.yml so a release runs the same checks, not a copy of them.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are wasted work; pushes to main are not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: gofmt + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make lint
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  test:
    name: test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # -race is not optional here: internal/lobby is shared mutable state
      # reached from every session goroutine, and several tests exist purely to
      # give the detector something to find.
      - name: Test
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage.out ] || exit 0
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          {
            echo "### Coverage: ${total}"
            echo
            echo "<details><summary>Per function</summary>"
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 14

  # The unit jobs above never touch a database. This one exists because the
  # Postgres repository and store.Memory are two implementations of one set of
  # semantics, and only a real database can show they still agree.
  integration:
    name: integration (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: typesafe
          POSTGRES_PASSWORD: typesafe
          POSTGRES_DB: typesafe_test
        ports:
          - 5432:5432
        # Without this the job races the container's startup and fails on a
        # connection refused that looks like a code bug.
        options: >-
          --health-cmd "pg_isready -U typesafe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        env:
          TYPESAFE_TEST_DSN: postgres://typesafe:typesafe@localhost:5432/typesafe_test?sslmode=disable
        run: go test -tags integration -race ./internal/store/...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Same flags the deploy uses, so a release cannot fail on something a
      # pull request could have caught.
      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o bin/typesafe ./cmd/server

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Pinned: @latest would run code nobody reviewed, and a behaviour change
      # in a fresh release would turn releases red with no code change. Bump it
      # deliberately.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
